<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1 1">
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#4dff5e" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#4dff5e" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#4dff5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceG" x1="0" y1="0.24" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4fdf6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.0252" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1" height="1" rx="0.2" fill="#05060a"/>
  <circle cx="0.5" cy="0.29" r="0.58" fill="url(#halo)"/>
  <g filter="url(#glow)">
    <!-- 베벨(테두리 경사) + 네온 발광 외곽선 -->
    <polygon points="0.5,0.2400000000000001 1.4,1.1400000000000001 0.5,2.04 -0.4,1.1400000000000001" fill="#bdf0c8" stroke="#4dff5e" stroke-width="0.0252" stroke-linejoin="round"/>
    <!-- 윗면 -->
    <polygon points="0.5,0.3660000000000001 1.274,1.1400000000000001 0.5,1.9140000000000001 -0.274,1.1400000000000001" fill="url(#faceG)"/>
  </g>
</svg>