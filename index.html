<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="숫자야구" />
    <meta name="description" content="야팬들은 게임에서도 야구를 해. 서로 다른 세 자리 숫자를 맞히는 숫자 야구 게임" />
    <meta name="author" content="dlwhsk0" />
    <meta name="copyright" content="© 2026 dlwhsk0. 상업적 이용 금지 (PolyForm Noncommercial 1.0.0)" />
    <title>숫자 야구</title>
    <!-- 링크 미리보기(카톡·X·인스타 DM 등). 이미지는 public/og-image.png(1200×630). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="숫자 야구" />
    <meta property="og:title" content="⚾ 숫자 야구 — 야팬들은 게임에서도 야구를 해" />
    <meta property="og:description" content="야팬들은 게임에서도 야구를 해. 스트라이크·볼·아웃으로 숨은 숫자를 맞혀 보세요. 혼자 또는 친구와 대결!" />
    <meta property="og:url" content="https://homerun-bb.vercel.app/" />
    <meta property="og:image" content="https://homerun-bb.vercel.app/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 다크가 기본. 저장된 테마(라이트/응원 구단)를 페인트 전에 복원해 깜빡임 방지.
         '응원 구단'을 고른 경우에만 구단 테마(App의 effectiveTheme과 같은 규칙 — 탭·랭킹전 무관). -->
    <script>
      try {
        var t = localStorage.getItem('nb_theme');
        var team = localStorage.getItem('nb_team');
        var teams = ['kia', 'samsung', 'lg', 'doosan', 'kt', 'ssg', 'lotte', 'hanwha', 'nc', 'kiwoom'];
        // 옛 이스터에그 값(doosan/lgtwins)은 '응원 구단' 테마로 이관(App과 같은 규칙).
        if (t === 'doosan' || t === 'lgtwins') {
          if (teams.indexOf(team) < 0) team = t === 'doosan' ? 'doosan' : 'lg';
          t = 'team';
        }
        if (t === 'team')
          t =
            teams.indexOf(team) < 0
              ? 'dark'
              : team === 'lg'
                ? 'lgtwins'
                : team === 'doosan'
                  ? 'doosan'
                  : 'team-' + team;
        if (t && t !== 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <!-- 구 주소 → 대표 주소(homerun-bb) 이사. 브라우저에서 열었을 때만 페인트 전에 넘긴다.
         설치된 PWA(standalone)는 넘기지 않는다 — 크로스 오리진으로 나가면 scope를 벗어나
         앱이 브라우저로 튕기고 localStorage(설정·닉네임)도 오리진이 달라 사라진다.
         그쪽은 App.tsx가 "새 주소에서 다시 설치" 배너로 안내한다. -->
    <script>
      try {
        var standalone =
          (window.matchMedia && matchMedia('(display-mode: standalone)').matches) ||
          navigator.standalone === true;
        if (location.hostname === 'number-baseball-chi.vercel.app' && !standalone)
          location.replace(
            'https://homerun-bb.vercel.app' + location.pathname + location.search + location.hash,
          );
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
