<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="숫자야구" />
    <meta name="description" content="서로 다른 세 자리 숫자를 맞히는 숫자 야구 게임" />
    <title>숫자 야구</title>
    <!-- 다크가 기본. 저장된 테마(라이트/두산)를 페인트 전에 복원해 깜빡임 방지. -->
    <script>
      try {
        var t = localStorage.getItem('nb_theme');
        if (t === 'light' || t === 'doosan' || t === 'lgtwins')
          document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
