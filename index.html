<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="숫자야구" />
    <meta name="description" content="서로 다른 세 자리 숫자를 맞히는 숫자 야구 게임" />
    <title>숫자 야구</title>
    <!-- 다크가 기본. 저장된 테마(라이트/두산)를 페인트 전에 복원해 깜빡임 방지. -->
    <script>
      try {
        var t = localStorage.getItem('nb_theme');
        if (t === 'light' || t === 'doosan' || t === 'lgtwins')
          document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <!-- 구 주소 → 대표 주소(homerun-bb) 이사. 브라우저에서 열었을 때만 페인트 전에 넘긴다.
         설치된 PWA(standalone)는 넘기지 않는다 — 크로스 오리진으로 나가면 scope를 벗어나
         앱이 브라우저로 튕기고 localStorage(설정·닉네임)도 오리진이 달라 사라진다.
         그쪽은 App.tsx가 "새 주소에서 다시 설치" 배너로 안내한다. -->
    <script>
      try {
        var standalone =
          (window.matchMedia && matchMedia('(display-mode: standalone)').matches) ||
          navigator.standalone === true;
        if (location.hostname === 'number-baseball-chi.vercel.app' && !standalone)
          location.replace(
            'https://homerun-bb.vercel.app' + location.pathname + location.search + location.hash,
          );
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
